[package]
name = "nostrdb_net"
version = "0.1.0"
# edition 2024: the absorbed relay_sync / nostrdb_relay modules use let-chains.
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_derive = "1"
serde = { version = "1", features = ["derive"] } # You only need this if you want app persistence
serde_json = { workspace = true }
nostr = { workspace = true }
bech32 = { workspace = true }
nostrdb = { workspace = true }
hex = { workspace = true }
# Equivalent<Pubkey> for &[u8; 32] so callers can look Pubkey-keyed maps up by
# raw bytes without allocating a Pubkey. Kept in lockstep with the notedeck
# workspace's hashbrown (0.15) so the trait unifies once enostr re-exports this.
hashbrown = "0.15"
# NIP-PNS (crate::pns): HKDF-Extract key derivation + NIP-44 v2 content,
# base64-wrapped for the kind-1080 content field.
base64 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# NIP-77 negentropy reconcile, used by the relay_sync + nostrdb_relay modules.
negentropy = { workspace = true }
# relay_sync opens its own nostrdb cache under the OS data dir.
dirs = { workspace = true }
# Native websocket transport (crate::relay::ws). We own the socket via
# tokio-tungstenite so relay liveness can be observed at the socket level;
# rustls-tls-webpki-roots provides wss:// TLS with bundled roots.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio = { workspace = true, features = ["sync", "rt", "net", "macros", "time"] }

# reset_sigpipe restores SIG_DFL for text-emitting CLIs built on relay_sync.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# SNS ingest tests stand up a real Ndb in a temp dir to exercise nostrdb's
# auto-unwrap + the plaintext->rumor promote path end to end.
tempfile = "3"
